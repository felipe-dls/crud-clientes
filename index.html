<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Clientes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>CRUD de Clientes</h1>

    <form id="form">
        <input
            type="text"
            id="nome"
            placeholder="Nome"
            required>

        <input
            type="email"
            id="email"
            placeholder="E-mail"
            required>

        <button type="submit">
            Salvar
        </button>
    </form>

    <div id="lista"></div>

</div>

<script src="script.js"></script>

</body>
</html>
